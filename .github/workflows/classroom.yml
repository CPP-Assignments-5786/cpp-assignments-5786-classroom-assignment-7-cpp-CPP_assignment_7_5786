name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: assignment 7 test
      id: assignment-7-test
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: assignment 7 test
        setup-command: ''
        command: make grade
        timeout: 3
        max-score: 100
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        ASSIGNMENT-7-TEST_RESULTS: "${{steps.assignment-7-test.outputs.result}}"
      with:
        runners: assignment-7-test
